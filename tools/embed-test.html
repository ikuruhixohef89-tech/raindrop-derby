<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed test</title>
<style>
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: #111014; color: #eee; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; cursor: default; }
  button.on { background: #f28a3b; color: #111; border-color: #f28a3b; }
  .frame { width: 960px; max-width: 100%; aspect-ratio: 16 / 9; resize: both; overflow: hidden; border: 1px solid #333; border-radius: 12px; background: #000; }
  .frame.r43 { aspect-ratio: 4 / 3; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .info { margin-top: 8px; color: #aaa; }
  .spacer { height: 600px; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="frame" id="frame">
  <iframe id="game" src="__GAME_URL__" allow="fullscreen; autoplay" title="Game"></iframe>
</div>
<div class="info" id="info"></div>
<p class="info">This host page is served from 127.0.0.1 and the game from localhost: different sites, like vinceandbyte.fun and github.io. Scroll the page to check that the title screen does not trap scrolling.</p>
<div class="spacer"></div>
<script>
  // Widths measured on vinceandbyte.fun (2026-10-01): phone 343, phone landscape 733, desktop 747.
  const presets = [
    ['288 (small phone)', 288, '16/9'],
    ['343 (phone)', 343, '16/9'],
    ['733 (phone landscape)', 733, '16/9'],
    ['747 (desktop site)', 747, '16/9'],
    ['960', 960, '16/9'],
    ['1280', 1280, '16/9'],
    ['800 (4:3)', 800, '4/3'],
  ];
  const bar = document.getElementById('bar');
  const frame = document.getElementById('frame');
  const info = document.getElementById('info');
  const show = () => { const r = frame.getBoundingClientRect(); info.textContent = `iframe ${Math.round(r.width)}x${Math.round(r.height)}`; };
  presets.forEach(([label, w, ar], i) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => {
      frame.style.width = w + 'px';
      frame.style.height = '';
      frame.classList.toggle('r43', ar === '4/3');
      [...bar.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      show();
    };
    bar.appendChild(b);
    if (i === 4) b.classList.add('on');
  });
  new ResizeObserver(show).observe(frame);
</script>
</body>
</html>
